[project]
name = "api-analytics-service"
version = "1.0.0"
description = "Backend for API Analytics"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.1",
    "fastapi[standard]>=0.128.0",
    "sqlalchemy>=2.0.45",
    "slowapi>=0.1.9",
    "redis>=5.0.0",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt>=2.10.1",
    "zxcvbn>=4.5.0",
    "types-zxcvbn>=4.5.0.20250809",
    "tenacity>=8.2.3",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "greenlet>=3.1.1",
    "python-json-logger>=4.0.0",
    "colorlog>=6.10.1",
    "psycopg[binary]>=3.3.2",
]

[dependency-groups]
dev = [
    "pytest-env>=1.2.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.26.0",
    "testcontainers[postgres]>=4.10.0",
    "ruff>=0.15.0",
    "mypy>=1.19.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["venv", ".venv", "alembic"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["testcontainers.*", "zxcvbn.*", "slowapi.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py314"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific improvements
    "DTZ",    # datetime timezone mistakes (huge bug source)
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.pytest]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = ["--cov=app", "--cov-report=term-missing"]

[tool.pytest_env]
ENVIRONMENT = "test"

[tool.coverage.run]
source = ["app"]
dynamic_context = "test_function"

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true
